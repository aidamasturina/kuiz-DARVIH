<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kuiz Eksplorasi DARVIH</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.css"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #8EC5FC;
            background-image: linear-gradient(135deg, #8EC5FC 0%, #E0C3FC 100%);
            overscroll-behavior: none;
        }
        
        /* Custom Animations */
        @keyframes bounce-slight {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bounce-slight {
            animation: bounce-slight 2s infinite ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .btn-option {
            transition: all 0.2s;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
        }
        .btn-option:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
        }
        
        .correct-ans {
            background-color: #4ade80 !important; /* Green */
            color: white !important;
            border-color: #16a34a !important;
        }
        .wrong-ans {
            background-color: #f87171 !important; /* Red */
            color: white !important;
            border-color: #dc2626 !important;
        }

        .speak-btn {
            transition: all 0.2s;
        }
        .speak-btn:hover {
            transform: scale(1.1);
        }
        .speak-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center p-4 text-gray-800">

    <div id="game-container" class="w-full max-w-2xl bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl overflow-hidden flex flex-col relative h-[95vh] md:h-auto md:min-h-[600px] border-4 border-white">
        
        <!-- ================= START SCREEN ================= -->
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center p-8 bg-gradient-to-br from-indigo-500 to-purple-600 text-white z-20">
            <div class="text-6xl mb-4 animate-bounce-slight">🛡️</div>
            <h1 class="text-4xl md:text-5xl font-bold text-center mb-4 leading-tight drop-shadow-md">
                Kuiz Eksplorasi<br><span class="text-yellow-300">D.A.R.V.I.H</span>
            </h1>
            <p class="text-lg md:text-xl text-center mb-8 bg-black/20 p-4 rounded-xl backdrop-blur-sm font-medium">
                Mari uji pengetahuan kita tentang bahaya Dadah, Alkohol, Rokok, Vape, Inhalan & HIV/AIDS!
            </p>
            <button onclick="startGame()" class="bg-yellow-400 hover:bg-yellow-300 text-indigo-900 text-2xl font-bold py-4 px-10 rounded-full shadow-[0_8px_0_#b45309] active:shadow-[0_0px_0_#b45309] active:translate-y-2 transition-all transform hover:scale-105 flex items-center gap-3">
                <i class="fa-solid fa-play"></i> MULA MAIN
            </button>
            
            <button onclick="showLeaderboard()" class="mt-6 bg-white/20 hover:bg-white/30 text-white text-xl font-bold py-3 px-8 rounded-full border-2 border-white/50 transition-all flex items-center gap-3">
                <i class="fa-solid fa-trophy text-yellow-300"></i> CARTA PEMENANG
            </button>
        </div>

        <!-- ================= GAME SCREEN ================= -->
        <div id="game-screen" class="hidden flex-col h-full w-full">
            
            <!-- Header (Score & Progress) -->
            <div class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow-md shrink-0">
                <div class="flex items-center gap-2 bg-indigo-800/50 px-4 py-2 rounded-full font-semibold">
                    <i class="fa-solid fa-star text-yellow-400"></i>
                    <span id="score-display">0</span>
                </div>
                <div class="font-bold text-lg bg-indigo-800/50 px-4 py-2 rounded-full">
                    Soalan <span id="current-question-num">1</span>/20
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-gray-200 h-3 shrink-0">
                <div id="progress-bar" class="bg-yellow-400 h-3 transition-all duration-500 ease-out w-0 rounded-r-full shadow-[0_0_10px_rgba(250,204,21,0.7)]"></div>
            </div>

            <!-- Question Area -->
            <div class="flex-grow flex flex-col items-center justify-center p-4 md:p-8 overflow-y-auto">
                
                <div id="question-box" class="w-full bg-blue-50 border-4 border-blue-200 rounded-2xl p-6 mb-6 text-center shadow-inner pop-in relative">
                    <button onclick="speakCurrentQuestion()" class="speak-btn absolute top-3 right-3 bg-yellow-400 text-indigo-900 rounded-full w-10 h-10 flex items-center justify-center shadow-md" aria-label="Dengar Soalan">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                    <h2 id="question-text" class="text-2xl md:text-3xl font-bold text-indigo-900 leading-snug mt-4">
                        <!-- Question goes here -->
                    </h2>
                </div>

                <div id="options-container" class="w-full flex flex-col gap-4">
                    <!-- Options injected via JS -->
                </div>

            </div>
            
            <!-- Feedback Overlay (Hidden by default) -->
            <div id="feedback-overlay" class="absolute inset-0 z-10 flex items-center justify-center bg-black/40 hidden backdrop-blur-sm">
                <div id="feedback-box" class="bg-white p-8 rounded-3xl shadow-2xl text-center transform scale-0 transition-transform duration-300 border-8">
                    <div id="feedback-icon" class="text-6xl mb-4"></div>
                    <h2 id="feedback-text" class="text-4xl font-bold mb-6 text-gray-800"></h2>
                    <button onclick="nextQuestion()" id="next-btn" class="bg-blue-500 hover:bg-blue-400 text-white text-xl font-bold py-3 px-8 rounded-full shadow-[0_6px_0_#1e3a8a] active:shadow-[0_0px_0_#1e3a8a] active:translate-y-[6px] transition-all">
                        Seterusnya <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= RESULT SCREEN ================= -->
        <div id="result-screen" class="hidden absolute inset-0 flex-col items-center justify-center p-8 bg-gradient-to-b from-green-400 to-blue-500 text-white z-20">
            <h1 class="text-5xl md:text-6xl font-bold mb-2 text-center drop-shadow-lg">Tahniah! 🎉</h1>
            <p class="text-2xl mb-8 font-medium">Anda telah tamat kuiz!</p>
            
            <div class="bg-white/20 p-8 rounded-3xl backdrop-blur-md border-4 border-white/50 text-center mb-8">
                <p class="text-xl mb-2">Markah Anda:</p>
                <div class="text-6xl font-extrabold text-yellow-300 drop-shadow-md mb-2 flex items-center justify-center gap-2">
                    <span id="final-score">0</span><span class="text-4xl text-white">/ 20</span>
                </div>
                <p id="result-message" class="text-xl font-bold mt-4"></p>
            </div>

            <!-- Name Submission Form -->
            <div id="score-submission" class="w-full max-w-md bg-white text-gray-800 p-6 rounded-2xl shadow-lg mb-8 text-center hidden">
                <h3 class="text-xl font-bold mb-4">Simpan Markah Anda!</h3>
                <input type="text" id="player-name" placeholder="Nama Panggilan..." class="w-full text-center text-xl p-3 border-2 border-indigo-200 rounded-xl mb-4 focus:outline-none focus:border-indigo-500 font-bold uppercase" maxlength="15">
                <button onclick="submitScore()" class="w-full bg-green-500 hover:bg-green-400 text-white text-xl font-bold py-3 px-6 rounded-xl shadow-[0_6px_0_#15803d] active:shadow-[0_0px_0_#15803d] active:translate-y-1 transition-all">
                    SIMPAN NAMA <i class="fa-solid fa-check ml-2"></i>
                </button>
            </div>

            <div class="flex flex-col md:flex-row gap-4 w-full max-w-md justify-center">
                <button onclick="resetGame()" class="flex-1 bg-white text-blue-600 hover:bg-gray-100 text-xl font-bold py-4 px-6 rounded-full shadow-[0_8px_0_#cbd5e1] active:shadow-[0_0px_0_#cbd5e1] active:translate-y-2 transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-rotate-right"></i> MAIN SEMULA
                </button>
                <button onclick="showLeaderboard()" class="flex-1 bg-yellow-400 text-indigo-900 hover:bg-yellow-300 text-xl font-bold py-4 px-6 rounded-full shadow-[0_8px_0_#b45309] active:shadow-[0_0px_0_#b45309] active:translate-y-2 transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-trophy"></i> CARTA PEMENANG
                </button>
            </div>
        </div>

        <!-- ================= LEADERBOARD SCREEN ================= -->
        <div id="leaderboard-screen" class="hidden absolute inset-0 flex-col items-center p-6 bg-gradient-to-br from-indigo-800 to-purple-900 text-white z-30">
            <h2 class="text-3xl md:text-5xl font-bold mb-4 text-center drop-shadow-lg text-yellow-300 flex items-center gap-3 mt-4">
                <i class="fa-solid fa-trophy"></i> Carta Pemenang
            </h2>
            
            <div class="w-full max-w-md bg-white/10 backdrop-blur-md border-4 border-white/30 rounded-3xl p-4 flex-grow overflow-hidden flex flex-col mb-6 shadow-2xl">
                <!-- Header List -->
                <div class="flex justify-between items-center text-lg font-bold border-b-2 border-white/20 pb-2 mb-2 px-2 text-indigo-200">
                    <span class="w-12 text-center">Ked.</span>
                    <span class="flex-grow text-left">Nama</span>
                    <span class="w-20 text-center">Markah</span>
                </div>
                
                <!-- Scrollable List -->
                <div id="leaderboard-list" class="flex-grow overflow-y-auto pr-2 space-y-2 flex flex-col justify-start">
                    <div class="text-center py-10 opacity-75">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2"></i><br>
                        Memuatkan data...
                    </div>
                </div>
            </div>

            <button onclick="hideLeaderboard()" class="shrink-0 bg-white text-indigo-900 hover:bg-gray-100 text-xl font-bold py-3 px-10 rounded-full shadow-[0_6px_0_#cbd5e1] active:shadow-[0_0px_0_#cbd5e1] active:translate-y-[6px] transition-all flex items-center gap-3 mb-2">
                <i class="fa-solid fa-xmark"></i> TUTUP
            </button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup untuk Carta Pemenang
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'darvih-kuiz-mbpk';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
        
        let db, auth;
        let isFirebaseReady = false;

        // Inisialisasi Pangkalan Data
        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                isFirebaseReady = true;
                
                // Mesti log masuk awan sebelum ambil/simpan data
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    signInWithCustomToken(auth, __initial_auth_token).catch(console.error);
                } else {
                    signInAnonymously(auth).catch(console.error);
                }
            } catch (error) {
                console.error("Ralat inisialisasi pangkalan data:", error);
            }
        }

        // Dedahkan fungsi kepada skop global supaya butang HTML boleh mengaksesnya
        window.startGame = startGame;
        window.speakCurrentQuestion = speakCurrentQuestion;
        window.nextQuestion = nextQuestion;
        window.resetGame = resetGame;
        window.showLeaderboard = showLeaderboard;
        window.hideLeaderboard = hideLeaderboard;
        window.submitScore = submitScore;

        let leaderboardUnsubscribe = null;

        // --- DATA SOALAN ---
        // Soalan umum DARVIH diolah dengan bahasa mudah untuk MBPK berserta emoji
        const rawQuestions = [
            { q: "Apakah maksud huruf 'D' dalam perkataan DARVIH?", options: ["Dadah 💊", "Duit 💰", "Daun 🍃"], ans: 0 },
            { q: "Apakah maksud huruf 'A' dalam perkataan DARVIH?", options: ["Alkohol 🍺", "Air Manis 🧃", "Ais Krim 🍦"], ans: 0 },
            { q: "Apakah kesan buruk menghisap rokok kepada tubuh badan kita?", options: ["Merosakkan paru-paru 🫁", "Menyihatkan badan 💪", "Mata jadi terang 👀"], ans: 0 },
            { q: "Vape adalah peranti elektronik. Adakah vape selamat untuk murid?", options: ["Tidak selamat ❌", "Sangat selamat ✅", "Boleh cuba sedikit 🤏"], ans: 0 },
            { q: "Perbuatan menghidu gam atau pelarut cat dipanggil apa?", options: ["Inhalan 🧴", "Mewarna 🎨", "Masakan 🍲"], ans: 0 },
            { q: "Apakah penyakit berbahaya berjangkit akibat kongsi jarum dadah?", options: ["HIV / AIDS 🦠", "Demam Selesema 🤒", "Sakit Perut 🤢"], ans: 0 },
            { q: "Jika orang tak dikenali beri pil pelik, apa perlu anda buat?", options: ["Tolak dan lapor guru 🏃‍♂️", "Ambil dan makan 😋", "Simpan dalam beg 🎒"], ans: 0 },
            { q: "Orang yang mabuk akibat minum banyak alkohol selalunya akan...", options: ["Hilang akal & kawalan 😵‍💫", "Jadi pandai 🧠", "Tidur dengan nyenyak 😴"], ans: 0 },
            { q: "Apakah slogan kita terhadap gejala DARVIH?", options: ["Katakan TIDAK 🛑", "Katakan YA ✅", "Diam sahaja 🤐"], ans: 0 },
            { q: "Siapa patut kita minta bantuan jika kawan ajak hisap rokok?", options: ["Guru dan Ibu Bapa 👨‍🏫", "Kawan lain 🧒", "Orang asing 👤"], ans: 0 },
            { q: "Menghidu gam beracun (inhalan) akan merosakkan apa?", options: ["Saraf otak 🧠", "Kuku jari 💅", "Rambut 💇"], ans: 0 },
            { q: "Walaupun vape berbau buah-buahan, di dalamnya ada apa?", options: ["Racun kimia 🧪", "Jus strawberi 🍓", "Air kosong 💧"], ans: 0 },
            { q: "Menghisap rokok di dalam kawasan sekolah adalah...", options: ["Langgar undang-undang 👮", "Perbuatan yang baik 👍", "Hak masing-masing 🤷"], ans: 0 },
            { q: "Jika kawan ajak ponteng hisap vape, apa patut anda buat?", options: ["Nasihat dan masuk kelas 🏫", "Ikut mereka ponteng 🏃", "Tolong perhatikan guru 👀"], ans: 0 },
            { q: "Virus HIV sangat bahaya kerana pesakit akan...", options: ["Sangat mudah jatuh sakit 🤒", "Menjadi sangat kuat 💪", "Boleh terbang 🦸"], ans: 0 },
            { q: "Bawa kenderaan selepas minum alkohol boleh sebabkan apa?", options: ["Kemalangan jalan raya 💥", "Sampai rumah cepat 🏎️", "Kereta jadi laju 🚘"], ans: 0 },
            { q: "Dadah di jalanan dijual oleh orang jahat untuk...", options: ["Merosakkan manusia 🧟", "Ubat batuk 😷", "Nampak bergaya 🕶️"], ans: 0 },
            { q: "Antara ini, mana gaya hidup sihat untuk jauhi DARVIH?", options: ["Bersenam & riadah 🏃‍♀️", "Tidur sepanjang hari 😴", "Main permainan video 24 jam 🎮"], ans: 0 },
            { q: "Jumpa jarum suntikan kotor di taman. Apa mesti anda buat?", options: ["Jangan sentuh & lapor 🚫", "Ambil dan buat main 🤹", "Bawa balik rumah 🏠"], ans: 0 },
            { q: "Kenapa Pendidikan DARVIH diajar kepada murid sekolah?", options: ["Lindungi keselamatan murid 🛡️", "Saja nak buang masa ⏱️", "Syarat lulus periksa 📝"], ans: 0 }
        ];

        // --- STATE VARIABLES ---
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let isAnswering = false;

        // Tone.js Synths
        let synthCorrect;
        let synthWrong;
        let isAudioReady = false;

        // Web Speech API
        const speechSynthesis = window.speechSynthesis;
        let malayVoice = null;
        let autoSpeak = true; // Boleh dimatikan atau dihidupkan jika perlu

        // --- HELPER FUNCTIONS ---
        // Shuffle array to randomize options
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Initialize Audio context on first user interaction
        async function initAudio() {
            if (!isAudioReady) {
                await Tone.start();
                synthCorrect = new Tone.PolySynth().toDestination();
                synthWrong = new Tone.PolySynth().toDestination();
                // Lower volume a bit
                synthCorrect.volume.value = -5;
                synthWrong.volume.value = -5;
                isAudioReady = true;

                // Prepare Text-to-Speech voices
                const voices = speechSynthesis.getVoices();
                // Allow fallback to Indonesian if ms-MY is missing
                malayVoice = voices.find(voice => voice.lang === 'ms-MY' || voice.lang === 'ms' || voice.lang.includes('id'));
            }
        }
        
        // Handle voice loading issues on some browsers
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = () => {
                const voices = speechSynthesis.getVoices();
                if(!malayVoice){
                    malayVoice = voices.find(voice => voice.lang === 'ms-MY' || voice.lang === 'ms' || voice.lang.includes('id'));
                }
            };
        }

        function speakText(text) {
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel(); // Stop if already speaking
            }
            if (text !== '') {
                const utterance = new SpeechSynthesisUtterance(text);
                if (malayVoice) {
                    utterance.voice = malayVoice;
                }
                utterance.rate = 0.9; // Sedikit perlahan untuk MBPK
                utterance.pitch = 1.1; // Sedikit tinggi supaya mesra kanak-kanak
                speechSynthesis.speak(utterance);
            }
        }

        function speakCurrentQuestion() {
            const qData = currentQuestions[currentIndex];
            // Bersihkan emoji dari teks untuk bacaan yang lebih baik
            const cleanQuestion = qData.question.replace(/[\u{1F600}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F300}-\u{1F5FF}\u{1F900}-\u{1F9FF}\u{1F018}-\u{1F270}\u{238C}-\u{2454}\u{20D0}-\u{20FF}]/gu, '');
            
            let textToSpeak = cleanQuestion + "... Pilihan jawapannya ialah: ";
            qData.options.forEach((optText, i) => {
                 const cleanOpt = optText.replace(/[\u{1F600}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F300}-\u{1F5FF}\u{1F900}-\u{1F9FF}\u{1F018}-\u{1F270}\u{238C}-\u{2454}\u{20D0}-\u{20FF}]/gu, '');
                 textToSpeak += `${i+1}, ${cleanOpt}. ... `;
            });

            speakText(textToSpeak);
        }

        function playSound(type) {
            if (!isAudioReady) return;
            if (type === 'correct') {
                // Happy bright sound
                synthCorrect.triggerAttackRelease(["C5", "E5", "G5", "C6"], "0.3");
            } else {
                // Sad low sound
                synthWrong.triggerAttackRelease(["C3", "Eb3"], "0.5");
            }
        }

        // --- GAME LOGIC ---
        async function startGame() {
            await initAudio(); // Start Audio Context
            
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('flex');
            
            // Prepare questions (we map them to remember the original correct answer text)
            currentQuestions = rawQuestions.map(q => {
                let correctAnswerText = q.options[q.ans];
                let shuffledOptions = shuffleArray([...q.options]);
                let correctIndex = shuffledOptions.indexOf(correctAnswerText);
                return {
                    question: q.q,
                    options: shuffledOptions,
                    correctIndex: correctIndex
                };
            });
            
            // Shuffle question order slightly for variety, but we want all 20.
            currentQuestions = shuffleArray(currentQuestions);

            currentIndex = 0;
            score = 0;
            updateUI();
            loadQuestion();
        }

        function loadQuestion() {
            isAnswering = true; // Allow clicking
            const qData = currentQuestions[currentIndex];
            
            // Stop any ongoing speech when loading a new question
            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }

            // Reset animations
            const qBox = document.getElementById('question-box');
            qBox.classList.remove('pop-in');
            void qBox.offsetWidth; // trigger reflow
            qBox.classList.add('pop-in');

            document.getElementById('question-text').innerText = qData.question;
            document.getElementById('current-question-num').innerText = currentIndex + 1;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            // Render buttons
            qData.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = `btn-option w-full bg-white border-2 border-indigo-200 text-indigo-900 text-xl md:text-2xl font-semibold py-4 px-6 rounded-2xl flex items-center justify-between hover:bg-indigo-50`;
                btn.innerHTML = `<span>${optText}</span> <div class="w-8 h-8 rounded-full border-2 border-indigo-200 flex items-center justify-center icon-container"></div>`;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            updateProgress();

            if (autoSpeak && isAudioReady) {
                // Tunda sedikit supaya tidak mengejutkan
                setTimeout(speakCurrentQuestion, 500); 
            }
        }

        function selectOption(selectedIndex, btnElement) {
            if (!isAnswering) return; // Prevent multiple clicks
            isAnswering = false;

            if (speechSynthesis.speaking) {
                speechSynthesis.cancel();
            }

            const qData = currentQuestions[currentIndex];
            const isCorrect = (selectedIndex === qData.correctIndex);
            
            const allBtns = document.getElementById('options-container').children;
            
            // Highlight answers
            for (let i = 0; i < allBtns.length; i++) {
                allBtns[i].disabled = true; // disable all
                const iconContainer = allBtns[i].querySelector('.icon-container');
                
                if (i === qData.correctIndex) {
                    allBtns[i].classList.add('correct-ans');
                    iconContainer.innerHTML = '<i class="fa-solid fa-check text-white"></i>';
                    iconContainer.classList.add('border-white');
                } else if (i === selectedIndex && !isCorrect) {
                    allBtns[i].classList.add('wrong-ans');
                    iconContainer.innerHTML = '<i class="fa-solid fa-xmark text-white"></i>';
                    iconContainer.classList.add('border-white');
                }
            }

            if (isCorrect) {
                score++;
                playSound('correct');
            } else {
                playSound('wrong');
            }

            updateUI();
            
            // Show Feedback Overlay after short delay
            setTimeout(() => {
                showFeedback(isCorrect);
            }, 600);
        }

        function showFeedback(isCorrect) {
            const overlay = document.getElementById('feedback-overlay');
            const box = document.getElementById('feedback-box');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            const nextBtn = document.getElementById('next-btn');

            overlay.classList.remove('hidden');
            
            if(isCorrect) {
                box.className = "bg-white p-8 rounded-3xl shadow-2xl text-center transform scale-0 transition-transform duration-300 border-8 border-green-400";
                icon.innerHTML = "🌟";
                icon.className = "text-7xl mb-4 animate-bounce";
                text.innerText = "Tepat Sekali!";
                text.className = "text-4xl font-bold mb-6 text-green-500";
                nextBtn.className = "bg-green-500 hover:bg-green-400 text-white text-xl font-bold py-3 px-8 rounded-full shadow-[0_6px_0_#15803d] active:shadow-[0_0px_0_#15803d] active:translate-y-[6px] transition-all";
            } else {
                box.className = "bg-white p-8 rounded-3xl shadow-2xl text-center transform scale-0 transition-transform duration-300 border-8 border-red-400";
                icon.innerHTML = "Oops! 🥺";
                icon.className = "text-7xl mb-4";
                text.innerText = "Kurang Tepat.";
                text.className = "text-4xl font-bold mb-6 text-red-500";
                nextBtn.className = "bg-red-500 hover:bg-red-400 text-white text-xl font-bold py-3 px-8 rounded-full shadow-[0_6px_0_#b91c1c] active:shadow-[0_0px_0_#b91c1c] active:translate-y-[6px] transition-all";
            }

            // Trigger scale animation
            setTimeout(() => {
                box.classList.remove('scale-0');
                box.classList.add('scale-100');
            }, 50);
        }

        function nextQuestion() {
            // Hide feedback
            const overlay = document.getElementById('feedback-overlay');
            const box = document.getElementById('feedback-box');
            box.classList.remove('scale-100');
            box.classList.add('scale-0');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
                
                currentIndex++;
                if (currentIndex < currentQuestions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 300); // Wait for scale down animation
        }

        function updateUI() {
            document.getElementById('score-display').innerText = score;
        }

        function updateProgress() {
            const progressPercent = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        }

        function endGame() {
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('flex');
            
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');

            document.getElementById('final-score').innerText = score;

            const msgEl = document.getElementById('result-message');
            if (score === 20) {
                msgEl.innerText = "Sempurna! Anda Duta Anti-DARVIH yang hebat! 👑";
            } else if (score >= 15) {
                msgEl.innerText = "Sangat bagus! Teruskan gaya hidup sihat! 👍";
            } else if (score >= 10) {
                msgEl.innerText = "Boleh tahan. Mari belajar lagi tentang bahaya DARVIH. 📚";
            } else {
                msgEl.innerText = "Jangan putus asa. Jauhi DARVIH untuk kesihatan! 💪";
            }

            // Papar borang simpan nama jika Pangkalan Data bersedia
            if (isFirebaseReady) {
                document.getElementById('score-submission').classList.remove('hidden');
                document.getElementById('player-name').value = '';
            }

            // Confetti Magic
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 }
              }));
              confetti(Object.assign({}, defaults, { particleCount,
                origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 }
              }));
            }, 250);
            
            if(isAudioReady) {
                 synthCorrect.triggerAttackRelease(["C5", "E5", "G5", "C6", "E6"], "1.5");
            }
        }

        function resetGame() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('flex');
            
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('start-screen').classList.add('flex');
            
            // reset progress bar width
            document.getElementById('progress-bar').style.width = `0%`;
            
            // sembunyikan kotak hantar nama
            document.getElementById('score-submission').classList.add('hidden');
        }

        // --- FUNGSI CARTA PEMENANG (LEADERBOARD) ---
        async function submitScore() {
            if (!isFirebaseReady || !auth.currentUser) return;
            
            const nameInput = document.getElementById('player-name');
            const playerName = nameInput.value.trim().toUpperCase() || "ANONIM";
            
            const btn = nameInput.nextElementSibling;
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> MENYIMPAN...';
            btn.disabled = true;

            try {
                // Simpan rekod ke dalam awan
                const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
                await addDoc(lbRef, {
                    name: playerName,
                    score: score,
                    timestamp: Date.now()
                });
                
                // Sembunyikan borang setelah berjaya
                document.getElementById('score-submission').classList.add('hidden');
                
                // Buka Carta Pemenang
                showLeaderboard();
            } catch (error) {
                console.error("Ralat menyimpan markah:", error);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function showLeaderboard() {
            document.getElementById('leaderboard-screen').classList.remove('hidden');
            document.getElementById('leaderboard-screen').classList.add('flex');
            
            if (!isFirebaseReady || !auth.currentUser) {
                document.getElementById('leaderboard-list').innerHTML = `
                    <div class="text-center py-10 px-4 text-red-200 font-bold">
                        <i class="fa-solid fa-triangle-exclamation text-5xl mb-4"></i><br>
                        Carta Pemenang tidak tersedia buat masa ini.
                    </div>`;
                return;
            }

            document.getElementById('leaderboard-list').innerHTML = `
                <div class="text-center py-10 opacity-75 animate-pulse">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3"></i><br>
                    Menyemak kedudukan...
                </div>`;

            const lbRef = collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            
            // Ambil data masa-nyata dari Awan
            leaderboardUnsubscribe = onSnapshot(lbRef, (snapshot) => {
                let scoresList = [];
                snapshot.forEach(doc => {
                    scoresList.push({ id: doc.id, ...doc.data() });
                });
                
                // Susun data: Markah Tertinggi di Atas. Jika seri, Masa Terawal menang.
                scoresList.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    return a.timestamp - b.timestamp;
                });
                
                renderLeaderboardUI(scoresList);
            }, (error) => {
                console.error("Ralat mengambil senarai:", error);
                document.getElementById('leaderboard-list').innerHTML = `
                    <div class="text-center py-10 px-4 text-red-200">Ralat memuatkan data carta.</div>`;
            });
        }

        function renderLeaderboardUI(scoresList) {
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '';
            
            if (scoresList.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-10 opacity-75 text-xl font-medium text-indigo-100">
                        Belum ada pemain. Jadi yang terawal!
                    </div>`;
                return;
            }

            // Papar carta pemenang
            scoresList.forEach((entry, index) => {
                const rank = index + 1;
                let rankVisual = `<span class="font-bold text-indigo-800">${rank}</span>`;
                let bgClass = "bg-white/20 text-white";
                
                // Gayakan berbeza untuk kedudukan Top 3
                if (rank === 1) {
                    rankVisual = `<i class="fa-solid fa-medal text-yellow-400 text-3xl"></i>`;
                    bgClass = "bg-yellow-400/40 border border-yellow-300 text-white";
                } else if (rank === 2) {
                    rankVisual = `<i class="fa-solid fa-medal text-gray-300 text-3xl"></i>`;
                    bgClass = "bg-gray-300/40 text-white border border-gray-300";
                } else if (rank === 3) {
                    rankVisual = `<i class="fa-solid fa-medal text-amber-600 text-3xl"></i>`;
                    bgClass = "bg-amber-600/40 text-white border border-amber-600";
                }

                const itemHTML = `
                    <div class="w-full flex justify-between items-center p-3 rounded-2xl ${bgClass} shadow-sm backdrop-blur-sm transition-transform hover:scale-[1.02]">
                        <div class="w-12 text-center flex justify-center items-center">
                            ${rankVisual}
                        </div>
                        <div class="flex-grow text-left font-bold text-xl px-3 truncate uppercase drop-shadow-sm">
                            ${entry.name}
                        </div>
                        <div class="w-20 text-center font-extrabold text-3xl text-yellow-300 drop-shadow-md">
                            ${entry.score}
                        </div>
                    </div>
                `;
                listEl.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        function hideLeaderboard() {
            document.getElementById('leaderboard-screen').classList.add('hidden');
            document.getElementById('leaderboard-screen').classList.remove('flex');
            
            // Berhenti mendengar perubahan data (jimat data awan) apabila tidak dipapar
            if (leaderboardUnsubscribe) {
                leaderboardUnsubscribe();
                leaderboardUnsubscribe = null;
            }
        }

    </script>
</body>
</html>
